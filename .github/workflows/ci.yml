name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  backend:
    name: Backend compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-kepu-video-server/requirements.txt
      - name: Install backend dependencies
        working-directory: ai-kepu-video-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        working-directory: ai-kepu-video-server
        run: python -m compileall src api_server.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-kepu-video-web/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ai-kepu-video-web/frontend
        run: npm ci
      - name: Build frontend
        working-directory: ai-kepu-video-web/frontend
        run: npm run build

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check README assets
        run: python scripts/check_readme_assets.py
      - name: Check tracked local-only paths
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|.*\.db$|.*\.sqlite$|.*\.sqlite3$|logs/|output/|data/local\.db|\.playwright-mcp/)' ; then
            echo "Local-only file is tracked. Remove it or document why it is public."
            exit 1
          fi
